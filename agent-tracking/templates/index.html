    <script>
        async function fetchSavedAgents() {
            const listContainer = document.getElementById('savedAgentsContainer');
            listContainer.innerHTML = '<p class="text-gray-400">Loading saved agents...</p>';
            try {
                const response = await fetch('/api/agents');
                if (!response.ok) throw new Error('Failed to fetch agents');
                const agents = await response.json();
                if (agents.length === 0) {
                    listContainer.innerHTML = '<p class="text-gray-400">No agents saved yet.</p>';
                    return;
                }
                listContainer.innerHTML = '<div class="bg-gradient-to-r from-gray-800 to-gray-900 rounded-2xl shadow-lg border border-gray-700 p-6 text-white overflow-y-auto max-h-[80vh]"><h2 class="text-2xl font-semibold mb-6 flex items-center space-x-3 text-pink-400"><i class="fas fa-list-alt animate-bounce"></i><span>Saved Agents</span></h2><div class="space-y-4 text-sm">';
                agents.forEach(agent => {
                    listContainer.innerHTML += `
                        <div class="bg-gray-800 p-4 rounded-lg shadow-md">
                            <h3 class="font-bold text-lg text-pink-400 mb-2">${agent.agentName}</h3>
                            <p><strong>Telegram ID:</strong> ${agent.telegramId}</p>
                            <p><strong>Daily Pay-In Volume:</strong> ${agent.payInVolume}</p>
                            <p><strong>Payout Volume:</strong> ${agent.payoutVolume}</p>
                            <p><strong>Pay-In Commission (%):</strong> ${agent.payInCommission}</p>
                            <p><strong>Payout Commission (%):</strong> ${agent.payoutCommission}</p>
                            <p><strong>Services Provided:</strong> ${agent.servicesProvided.join(', ')}</p>
                            <p><strong>Wallets Promised:</strong> ${agent.walletsPromised.join(', ')}</p>
                            <p><strong>Wallets Provided:</strong> ${agent.walletsProvided.join(', ')}</p>
                            <p class="text-xs text-gray-500 mt-2">Saved on: ${new Date(agent.timestamp).toLocaleString()}</p>
                        </div>
                    `;
                });
                listContainer.innerHTML += '</div></div>';
            } catch (error) {
                listContainer.innerHTML = `<p class="text-red-500">Error loading agents: ${error.message}</p>`;
            }
        }

        document.getElementById('agentForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const form = e.target;
            const formData = {
                agentName: form.agentName.value,
                telegramId: form.telegramId.value,
                payInVolume: parseFloat(form.payInVolume.value),
                payoutVolume: parseFloat(form.payoutVolume.value),
                payInCommission: parseFloat(form.payInCommission.value),
                payoutCommission: parseFloat(form.payoutCommission.value),
                servicesProvided: Array.from(form.querySelectorAll('input[name="servicesProvided"]:checked')).map(cb => cb.value),
                walletsPromised: Array.from(form.querySelectorAll('input[name="walletsPromised"]:checked')).map(cb => cb.value),
                walletsProvided: Array.from(form.querySelectorAll('input[name="walletsProvided"]:checked')).map(cb => cb.value)
            };

            try {
                const response = await fetch('/api/save-agent', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(formData)
                });

                const result = await response.json();

                const notification = document.getElementById('notification');
                if (response.ok) {
                    notification.textContent = 'Agent details saved successfully!';
                    notification.className = 'fixed bottom-4 right-4 p-4 bg-green-500 text-white rounded-lg shadow-lg';
                    form.reset();
                    fetchSavedAgents();
                } else {
                    notification.textContent = result.message || 'Error saving agent details';
                    notification.className = 'fixed bottom-4 right-4 p-4 bg-red-500 text-white rounded-lg shadow-lg';
                }

                notification.classList.remove('hidden');
                setTimeout(() => {
                    notification.classList.add('hidden');
                }, 3000);
            } catch (error) {
                console.error('Error:', error);
                const notification = document.getElementById('notification');
                notification.textContent = 'Error saving agent details';
                notification.className = 'fixed bottom-4 right-4 p-4 bg-red-500 text-white rounded-lg shadow-lg';
                notification.classList.remove('hidden');
                setTimeout(() => {
                    notification.classList.add('hidden');
                }, 3000);
            }
        });

        // Initial fetch of saved agents
        fetchSavedAgents();
    </script>
</body>
